name: Daily lesson

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run = make + upload today''s lesson, prepare = make the next lesson without uploading, check = test the Claude login'
        type: choice
        options: [run, prepare, check]
        default: run

concurrency: daily

permissions:
  contents: write

jobs:
  lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Karachi
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - if: inputs.mode == 'check'
        run: claude -p "Reply with exactly: OK"

      - if: inputs.mode != 'check'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: inputs.mode != 'check'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - if: inputs.mode != 'check'
        run: npm ci

      - if: inputs.mode != 'check'
        uses: actions/cache@v4
        with:
          path: |
            models
            node_modules/.remotion
          key: assets-${{ hashFiles('package-lock.json') }}

      - if: inputs.mode != 'check'
        run: python -m venv .venv && .venv/bin/pip install -r tools/requirements.txt

      - if: inputs.mode != 'check'
        run: node tools/daily.mjs ${{ inputs.mode == 'prepare' && 'prepare' || '' }}

      - if: always() && inputs.mode != 'check'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Daily lesson $(date +%F)"
          git pull --rebase
          git push

      - if: always() && inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-${{ github.run_number }}
          path: |
            out/*.mp4
            out/daily.log
          if-no-files-found: ignore
